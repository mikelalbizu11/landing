<!DOCTYPE html>
<html>
  <head>
    <title>Mikel Albizu experiences</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="./css/style.css">

    <style>
      .banner {
		background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url("images/spain.jpg");        
		background-size: cover;
        background-position: center;
        background-color: #333; 
        padding: 150px 0px;
        text-align: center;
        margin-bottom: 40px;
      }

      .banner h1 {
        color: white;
        font-family: 'Roboto', sans-serif;
        font-size: 50px;
      }

      .btn-blue {
        background-color: #6D71DD;
        padding: 15px 20px;
        border-radius: 4px;
        color: whitesmoke;
        font-weight: bold;
        font-family: Roboto, sans-serif;
        display: inline-block;
      }
		      
		.card {
		  padding: 20px;
		  display: flex;
		  align-items: center;
		  justify-content: space-between;
		  box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
		  border-radius: 6px;
		  margin: 40px 0; /* Un poco de margen para separarla */
		  background-color: white;
		}
		.card img {
		  width: 150px;
		  border-radius: 6px;
		}
		.card h3 {
		  flex-grow: 1;
		  padding-left: 20px;
		  font-size: 24px;
		  margin: 0;
		}

    </style>

  </head>

<body>

  <div class="banner">
  <div class="container">
    <h1>Change your life, go to the nature</h1>
    <h2>It helps both your mental and physical health</h2>
  </div>


</div>

  <div class="container">
   
	<h2>Activities I have done</h2>

	<div class="cards">

	<div class="card">
		<img src="images/Montblanc.jpg" alt="Montblanc picture">
		<h3>Tour du Montblanc</h3>
	</div>

	<div class="card">
		<img src="images/Candanchu.jpg" alt="Ski picture">
		<h3>Ski at the Pyrenees</h3>
	
	</div>

	<div class="card">
		<img src="images/tirolina.jpg" alt="Zipline picture">
		<h3>Longest Zip-line in Europe</h3>
	</div>

  </div>

</body>
